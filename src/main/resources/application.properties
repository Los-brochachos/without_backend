spring.application.name=without_backend


!CONEXION BASE DE DATOS
spring.datasource.username=root
spring.datasource.password=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/withoutdb?createDatabaseIfNotExist=true

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Con "update", crear también restricciones UNIQUE nuevas en tablas existentes (p. ej. uk_cliente_ruc)
spring.jpa.properties.hibernate.schema_update.unique_constraint_strategy=RECREATE_QUIETLY



!PROPIEDADES SPRINB SECURITY
application.jwt.secret-key=${JWT_SECRET:}
application.jwt.token-prefix=Bearer 
application.jwt.access-token-expiration-minutes=15
application.jwt.refresh-token-expiration-after-days=30
application.auth.cookie-secure=true
application.auth.cookie-same-site=Strict


!DOCUMENTACION SWAGGER / OPENAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.with-credentials=true
!No guardar el JWT en localStorage del navegador
springdoc.swagger-ui.persist-authorization=false
