# ============================================================================
# PERFIL DE PRODUCCION (Render + TiDB Cloud)
# Todo lo sensible llega por variables de entorno; nada de esto se guarda en el repositorio.
# ============================================================================

# --- Base de datos (TiDB Cloud, MySQL compatible). Si falta una variable, el arranque falla. ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Pool pequeno (512 MB de RAM) y conexiones que se renuevan antes de que el servidor las cierre.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-timeout=30000

# --- JPA ---
spring.jpa.show-sql=false
# "update" mantiene el esquema sincronizado con las entidades. Cuando el modelo se estabilice,
# conviene pasar a "validate" y gestionar los cambios con migraciones (Flyway).
spring.jpa.hibernate.ddl-auto=update

# --- Seguridad ---
application.jwt.secret-key=${JWT_SECRET}
application.auth.cookie-secure=true
application.auth.cookie-same-site=Strict
# Origen(es) del frontend, separados por comas. Obligatorio: ver README de despliegue.
application.auth.allowed-origins=${ALLOWED_ORIGINS}

# Primer SUPERADMIN (solo se crea si no existe ninguno). Contrasena de al menos 12 caracteres.
application.bootstrap.superadmin-email=${BOOTSTRAP_SUPERADMIN_EMAIL:}
application.bootstrap.superadmin-password=${BOOTSTRAP_SUPERADMIN_PASSWORD:}

# --- Servidor detras del proxy de Render (TLS lo termina Render) ---
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful

# En produccion no se publica la documentacion interactiva de la API.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
