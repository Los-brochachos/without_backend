# Solo se carga desde src/test/resources y con el perfil test.
# Usa las credenciales locales existentes, segun autorizacion del usuario.
# Solo se reemplaza el destino: nunca se usa la base habitual en estas pruebas.
spring.datasource.url=jdbc:mysql://localhost:3306/withoutdb_test

# Crea las tablas al abrir el contexto y las elimina al cerrarlo.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Las pruebas no necesitan JWT_SECRET ni cookies de produccion.
application.jwt.secret-key=
application.auth.cookie-secure=false
